name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [probe-site]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public pages of fileora.in
        run: |
          mkdir -p out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          curl -sSL -A "$UA" https://fileora.in/ -o out/home.html || true
          curl -sSL -A "$UA" "https://fileora.in/wp-json/fileora/v1/app-config?platform=android" -o out/app-config.json || true
          grep -oE 'href="[^"]+\.css[^"]*"' out/home.html | sed 's/href="//;s/"$//' | sed 's/&#038;/\&/g' > out/css-list.txt || true
          i=0; while read -r u; do i=$((i+1)); curl -sSL -A "$UA" "$u" -o "out/css-$i.css" || true; echo "$i $u" >> out/css-map.txt; done < out/css-list.txt
          grep -oE '<img[^>]+custom-logo[^>]*>' out/home.html > out/logo-tags.txt || true
          grep -oE 'src="[^"]+"' out/logo-tags.txt | head -2 | sed 's/src="//;s/"$//' | while read -r u; do curl -sSL -A "$UA" "$u" -o "out/logo-$(basename "${u%%\?*}")" || true; done
          ls -la out
      - name: Save
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git rm -rq --cached . >/dev/null; git add out; git commit -qm "probe output"; git push -q origin HEAD:probe-out
