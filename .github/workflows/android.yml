# Builds the Fileora Android app on GitHub: every push to main, or by hand (Actions → Build Android APK → Run workflow).
# Result (about 15 minutes): Actions → the run → Artifacts → "fileora-apk", and builds/fileora-app.apk in the "builds" branch.
name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # only to publish the APK to the "builds" branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install JavaScript packages
        run: npm ci
      - name: Check the code (TypeScript + ESLint, scanner page up to date)
        run: |
          node scripts/build-editor.js && git diff --exit-code src/scanner/editorHtml.ts
          npx tsc --noEmit && npx eslint App.tsx src
      # Signing: with the repository's private key when its secrets exist (Settings → Secrets and
      # variables → Actions: FILEORA_KEYSTORE_BASE64, FILEORA_KEYSTORE_PASSWORD, FILEORA_KEY_ALIAS,
      # FILEORA_KEY_PASSWORD). Without them the APK uses React Native's public test key (testing only).
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.FILEORA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fileora-release.keystore"
            echo "FILEORA_KEYSTORE_FILE=$RUNNER_TEMP/fileora-release.keystore" >> "$GITHUB_ENV"
            echo "Signing with the private release key"
          else
            echo "::warning::No signing secrets: this APK is signed with the public test key (for testing only)"
          fi
      - name: Build APK (release)
        working-directory: android
        env:
          FILEORA_KEYSTORE_PASSWORD: ${{ secrets.FILEORA_KEYSTORE_PASSWORD }}
          FILEORA_KEY_ALIAS: ${{ secrets.FILEORA_KEY_ALIAS }}
          FILEORA_KEY_PASSWORD: ${{ secrets.FILEORA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: fileora-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      # Also keep the latest APK in the "builds" branch: builds/fileora-app.apk (one commit, replaced each time).
      - name: Publish APK to the builds branch
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out && cp android/app/build/outputs/apk/release/app-release.apk out/fileora-app.apk
          cd out
          echo "Fileora app APK from commit ${GITHUB_SHA::7} ($(date -u +%Y-%m-%d))" > README.md
          git init -q -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fileora-app.apk README.md
          git commit -q -m "APK from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" builds
