# Builds the Fileora iOS app on GitHub (macOS runner): every push to main, or by hand
# (Actions → Build iOS app → Run workflow).
#
# With the Apple secrets below, the build is signed and uploaded to App Store Connect → TestFlight
# (about 30 minutes, then Apple processes it for 10–30 minutes). From TestFlight the same build can
# later be submitted to the App Store. Without them, the app is only built for the iOS Simulator,
# to check that it compiles.
#
# Secrets (Settings → Secrets and variables → Actions → New repository secret):
#   APPLE_TEAM_ID            10-character Team ID (developer.apple.com → Account → Membership details)
#   ASC_KEY_ID               App Store Connect API key: Key ID
#   ASC_ISSUER_ID            App Store Connect API key: Issuer ID
#   ASC_KEY_P8               App Store Connect API key: the whole AuthKey_XXXX.p8 file (open in Notepad, copy all)
#   GOOGLE_SERVICE_INFO_PLIST  Firebase iOS config: the whole GoogleService-Info.plist (for notifications)
# Optional, only if automatic signing doesn't work for your account (manual signing):
#   IOS_DIST_CERT_P12_BASE64, IOS_DIST_CERT_PASSWORD, IOS_PROFILE_BASE64
# Never put these values in the code, a commit or a chat.
name: Build iOS app
on:
  push:
    branches: [main]
    paths-ignore: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: write # only to publish simulator screenshots to the "builds-ios" branch
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Install JavaScript packages
        run: npm ci
      # AdMob: Fileora's own App ID from the repository variable ADMOB_IOS_APP_ID. Without it the
      # build keeps Google's sample App ID, which can only show test ads.
      - name: AdMob App ID
        env:
          ADMOB_ID: ${{ vars.ADMOB_IOS_APP_ID }}
        run: |
          if [ -n "$ADMOB_ID" ]; then
            if ! echo "$ADMOB_ID" | grep -Eq '^ca-app-pub-[0-9]{10,20}~[0-9]{6,12}$'; then
              echo "::error::ADMOB_IOS_APP_ID must be an AdMob App ID like ca-app-pub-1234567890123456~1234567890"
              exit 1
            fi
            /usr/libexec/PlistBuddy -c "Set :GADApplicationIdentifier $ADMOB_ID" ios/FileoraApp/Info.plist
            node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('app.json','utf8'));j['react-native-google-mobile-ads'].ios_app_id=process.env.ADMOB_ID;fs.writeFileSync('app.json',JSON.stringify(j,null,2)+'\n')"
            sed -i '' 's/ADMOB_APP_ID_LIVE = false/ADMOB_APP_ID_LIVE = true/' src/ads/build.ts
            echo "AdMob: Fileora's App ID"
          else
            echo "::notice::No ADMOB_IOS_APP_ID variable: Google's sample AdMob App ID, test ads only"
          fi
      - name: Check the code (TypeScript + ESLint)
        run: npx tsc --noEmit && npx eslint App.tsx src

      - name: Version
        run: |
          V=$(node -p "require('./package.json').version")
          IFS=. read -r MA MI PA <<< "$V"
          CODE=$((MA * 10000 + MI * 100 + PA))
          echo "MARKETING_VERSION=$V" >> "$GITHUB_ENV"
          # unique for every upload of the same version: 600.1, 600.2…
          echo "BUILD_NUMBER=$CODE.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "Fileora $V (build $CODE.$GITHUB_RUN_NUMBER)"

      - name: Firebase config (notifications, analytics)
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$PLIST" ]; then
            printf '%s' "$PLIST" > ios/FileoraApp/GoogleService-Info.plist
            plutil -lint ios/FileoraApp/GoogleService-Info.plist
            echo "Firebase config added"
          elif [ -f ios/FileoraApp/GoogleService-Info.plist ]; then
            echo "Firebase config from the repository"
          else
            echo "::warning::No GOOGLE_SERVICE_INFO_PLIST secret: this build has no notifications or analytics"
          fi

      - name: Install iOS libraries (CocoaPods)
        working-directory: ios
        run: bundle exec pod install

      - name: Signing mode
        id: mode
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          if [ -n "$TEAM" ] && [ -n "$KEY_ID" ] && [ -n "$ISSUER" ] && [ -n "$KEY_P8" ]; then
            mkdir -p "$RUNNER_TEMP/keys"
            printf '%s' "$KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
            echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"
            if [ -n "$P12" ] && [ -n "$PROFILE" ]; then echo "mode=manual" >> "$GITHUB_OUTPUT"; else echo "mode=automatic" >> "$GITHUB_OUTPUT"; fi
          else
            echo "mode=simulator" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple secrets not set: building for the iOS Simulator only (no TestFlight upload)"
          fi

      # ---------- without Apple secrets: compile check ----------
      - name: Build for the iOS Simulator
        if: steps.mode.outputs.mode == 'simulator'
        run: |
          set -o pipefail
          xcodebuild -workspace ios/FileoraApp.xcworkspace -scheme FileoraApp -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" CODE_SIGNING_ALLOWED=NO \
            build > "$RUNNER_TEMP/build.log" 2>&1 || { grep -n "error:" "$RUNNER_TEMP/build.log" | head -60; tail -120 "$RUNNER_TEMP/build.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/build.log"
          cd ios/build/Build/Products/Release-iphonesimulator && zip -qry "$RUNNER_TEMP/Fileora-simulator.zip" FileoraApp.app
      # app 1.2.2: an unsigned iPhone build (.ipa) for sideloading. Apple only installs apps signed
      # with a certificate: re-sign it with your own Apple ID (Sideloadly, AltStore) or add the
      # Apple secrets for a signed TestFlight build. Published to the "builds-ios" branch (device/).
      - name: Build unsigned IPA (for re-signing / sideloading)
        if: steps.mode.outputs.mode == 'simulator'
        run: |
          set -o pipefail
          xcodebuild -workspace ios/FileoraApp.xcworkspace -scheme FileoraApp -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath ios/build-device \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > "$RUNNER_TEMP/build-device.log" 2>&1 || { grep -n "error:" "$RUNNER_TEMP/build-device.log" | head -60; tail -120 "$RUNNER_TEMP/build-device.log"; exit 1; }
          tail -3 "$RUNNER_TEMP/build-device.log"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" out/device
          cp -R ios/build-device/Build/Products/Release-iphoneos/FileoraApp.app "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/out/device/Fileora-$MARKETING_VERSION-unsigned.ipa" Payload)
          ls -la out/device
          shasum -a 256 out/device/*.ipa > out/device/SHA256SUMS.txt
      # Start the app in an iPhone simulator: it must open and keep running (no crash at start).
      # Screenshots go to the "builds-ios" branch (simulator/home.png).
      - name: Run in the iPhone simulator
        if: steps.mode.outputs.mode == 'simulator'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP=ios/build/Build/Products/Release-iphonesimulator/FileoraApp.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' -c 'Print :CFBundleIdentifier' -c 'Print :CFBundleShortVersionString' -c 'Print :CFBundleVersion' "$APP/Info.plist"
          ls -la "$APP/main.jsbundle" "$APP/fileora_notify.caf"
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Simulator: $DEV"
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$APP"
          xcrun simctl launch "$DEV" in.fileora.app
          mkdir -p out/simulator
          sleep 12
          xcrun simctl io "$DEV" screenshot out/simulator/start.png
          sleep 20
          # app 1.2: the first launch shows the permissions screen; then it is closed for the rest
          xcrun simctl io "$DEV" screenshot out/simulator/v12-setup.png
          xcrun simctl terminate "$DEV" in.fileora.app || true
          xcrun simctl launch "$DEV" in.fileora.app -FileoraSetup done
          sleep 12
          xcrun simctl io "$DEV" screenshot out/simulator/home.png
          # the offline tool engine in WKWebView: its self-test (fileora://selftest)
          # (started with a launch argument: a link would first ask "Open in Fileora?")
          xcrun simctl terminate "$DEV" in.fileora.app || true
          xcrun simctl launch "$DEV" in.fileora.app -FileoraSelfTest 1
          sleep 50
          xcrun simctl io "$DEV" screenshot out/simulator/selftest.png
          for t in watermark sign examphoto; do
            xcrun simctl terminate "$DEV" in.fileora.app || true
            xcrun simctl launch "$DEV" in.fileora.app -FileoraTool "$t"
            sleep 18
            xcrun simctl io "$DEV" screenshot "out/simulator/tool-$t.png"
          done
          # app 1.1: Downloads, Home in Hindi and Arabic, and Arabic after a restart (right to left)
          xcrun simctl terminate "$DEV" in.fileora.app || true
          xcrun simctl launch "$DEV" in.fileora.app -FileoraScreen downloads
          sleep 15
          xcrun simctl io "$DEV" screenshot out/simulator/v11-downloads.png
          for l in hi ar; do
            xcrun simctl terminate "$DEV" in.fileora.app || true
            xcrun simctl launch "$DEV" in.fileora.app -FileoraLang "$l"
            sleep 15
            xcrun simctl io "$DEV" screenshot "out/simulator/v11-home-$l.png"
          done
          xcrun simctl terminate "$DEV" in.fileora.app || true
          xcrun simctl launch "$DEV" in.fileora.app
          sleep 15
          xcrun simctl io "$DEV" screenshot out/simulator/v11-home-ar-restart.png
          xcrun simctl terminate "$DEV" in.fileora.app || true
          xcrun simctl launch "$DEV" in.fileora.app -FileoraLang en
          sleep 10
          # app 1.2: Alerts with unread dots, an alert's whole message, the in-app banner
          for d in alerts alert banner; do
            xcrun simctl terminate "$DEV" in.fileora.app || true
            xcrun simctl launch "$DEV" in.fileora.app -FileoraDemo "$d"
            sleep 12
            xcrun simctl io "$DEV" screenshot "out/simulator/v12-$d.png"
          done
          # app 1.2.3: festival banners with each festival's own animation (plugin 2.24 data)
          for fest in diwali holi onam lunar-new-year; do
            xcrun simctl terminate "$DEV" in.fileora.app || true
            xcrun simctl launch "$DEV" in.fileora.app -FileoraDemo "festival/$fest"
            sleep 9
            xcrun simctl io "$DEV" screenshot "out/simulator/v123-festival-$fest.png"
            sleep 2
            xcrun simctl io "$DEV" screenshot "out/simulator/v123-festival-$fest-2.png"
          done
          xcrun simctl spawn "$DEV" log show --last 2m --style compact --predicate 'process == "FileoraApp"' 2>/dev/null | grep -iE "error|exception|fatal|crash" | grep -v "nw_\|CFNetwork" | tail -40 > out/simulator/log.txt || true
          if xcrun simctl spawn "$DEV" launchctl list | grep -q "in.fileora.app"; then echo "RUNNING" > out/simulator/status.txt; echo "Fileora is running in the simulator"; else echo "NOT RUNNING" > out/simulator/status.txt; echo "::error::Fileora is not running in the simulator (crash at start?)"; fi
          ls -la ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i fileora || true
          cd out
          echo "Fileora iOS simulator run from commit ${GITHUB_SHA::7} ($(date -u '+%Y-%m-%d %H:%M'))" > README.md
          git init -q -b builds-ios
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "iOS simulator run ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" builds-ios
          grep -q RUNNING simulator/status.txt && ! grep -q "NOT RUNNING" simulator/status.txt
      - uses: actions/upload-artifact@v4
        if: steps.mode.outputs.mode == 'simulator'
        with:
          name: fileora-ios-simulator
          path: ${{ runner.temp }}/Fileora-simulator.zip
          retention-days: 14

      # ---------- with Apple secrets: signed build → TestFlight ----------
      - name: Certificate and profile (manual signing)
        if: steps.mode.outputs.mode == 'manual'
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          KC="$RUNNER_TEMP/fileora.keychain-db"; KCP=$(openssl rand -hex 16)
          security create-keychain -p "$KCP" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCP" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCP" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/dist.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/fileora.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/fileora.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/fileora.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Profile: $NAME"

      - name: Archive (signed)
        if: steps.mode.outputs.mode != 'simulator'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          if [ "${{ steps.mode.outputs.mode }}" = manual ]; then
            python3 scripts/ios-signing.py manual "$TEAM" "$PROFILE_NAME"
            AUTH=()
          else
            python3 scripts/ios-signing.py automatic "$TEAM"
            AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          fi
          xcodebuild archive -workspace ios/FileoraApp.xcworkspace -scheme FileoraApp -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Fileora.xcarchive" \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" "${AUTH[@]}" \
            > "$RUNNER_TEMP/build.log" 2>&1 || { grep -n "error:" "$RUNNER_TEMP/build.log" | head -60; tail -120 "$RUNNER_TEMP/build.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/build.log"

      - name: Upload to App Store Connect (TestFlight)
        if: steps.mode.outputs.mode != 'simulator'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          STYLE=automatic; [ "${{ steps.mode.outputs.mode }}" = manual ] && STYLE=manual
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>$STYLE</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          if [ "$STYLE" = manual ]; then
            /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" -c "Add :provisioningProfiles:in.fileora.app string $PROFILE_NAME" "$RUNNER_TEMP/ExportOptions.plist"
          fi
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Fileora.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            > "$RUNNER_TEMP/export.log" 2>&1 || { grep -n "error" "$RUNNER_TEMP/export.log" | head -40; tail -80 "$RUNNER_TEMP/export.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/export.log"
          echo "### Uploaded Fileora $MARKETING_VERSION ($BUILD_NUMBER) to App Store Connect" >> "$GITHUB_STEP_SUMMARY"
          echo "It appears in App Store Connect → Fileora → TestFlight after Apple's processing (10–30 minutes)." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove keys
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/fileora.mobileprovision" ios/FileoraApp/GoogleService-Info.plist
          security delete-keychain "$RUNNER_TEMP/fileora.keychain-db" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-build-log
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/export.log
          retention-days: 7
